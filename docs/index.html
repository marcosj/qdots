    <div class="reveal">
        <div class="slides">

            <section>
                <h2>Clifford deformed codes tailored to quantum dot noise</h2>
                <h5 style="text-align: right;">Marcos Jiménez</h5>
            </section>

            <section data-markdown>
                <textarea data-template>
                    ## Objetivo general
                    Cuantificar el desempeño de un código de Bacon-Shor con deformaciones de Clifford en el contexto de una plataforma de puntos cuánticos para

                    * ampliar el repertorio de posibles códigos de corrección cuántica de errores apropiados a cúbits de espín en puntos cuánticos y
                    * guiar experimentos futuros.
                </textarea>
            </section>

            <section>
                <section data-markdown>
                    <textarea data-template>
                        ## Objetivo 1
                        Simular el código de superficie tradicional (de tipo CSS) y el código de Bacon-Shor tradicional (de tipo CSS) bajo ruido despolarizador (simétrico, no sesgado) a nivel de circuito.

                        Esto se hará como un "chequeo de sanidad" para reproducir resultados previos de la literatura.

                        Esto se hara para códigos de distancia d = 3, 5, 7, 9.

                        Se cuantificarán dos resultados:
                        * Tasa de error lógico (tasa de fallo) después de una ronda de corrección de errores, en función de p
                        * Decaimiento de la fidelidad lógica en función del número de rondas de corrección de errores.
                    </textarea>
                </section>

                <section data-markdown>
                    <textarea data-template>
                        ### Rotated surface code memory Z
                        <div class="image-row">
                        <img src="img/scz_th.svg">
                        <img src="img/scz_fi.svg">
                        </div>
                    </textarea>
                </section>

                <section data-markdown>
                    <textarea data-template>
                        ### Rotated surface code memory X
                        <div class="image-row">

                        ### Bacon-Shor code memory Z

                        <img src="img/bsz_fi.svg">

                    </textarea>
                </section>
            </section>

                        Se cuantificarán dos resultados:
                        * Tasa de error lógico (tasa de fallo)
                        * Umbral en función del sesgo.
                    </textarea>
                </section>
